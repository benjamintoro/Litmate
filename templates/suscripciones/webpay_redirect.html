{% extends 'base.html' %}
{% block title %}Redirigiendo a Webpay Plus... - LitMate{% endblock %}

{% block content %}
<div class="container text-center py-5 my-5">
    <div class="card border-0 shadow-lg p-5 mx-auto webpay-redirect-card">
        <div class="spinner-border text-primary mb-4 webpay-spinner" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <h4 class="fw-bold text-dark mb-2">Conectando con Transbank Webpay Plus...</h4>
        <p class="text-muted small mb-4">Serás redirigido al portal seguro de pago en unos segundos.</p>

        <form action="{{ url }}" method="POST" id="webpayForm">
            <input type="hidden" name="token_ws" value="{{ token }}" />
            <button type="submit" class="btn btn-primary rounded-pill px-4">
                Si no eres redirigido automáticamente, haz clic aquí
            </button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('webpayForm');
        if (form) {
            form.submit();
        }
    });
</script>
{% endblock %}
