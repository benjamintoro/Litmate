use_default_settings:
  engines:
    keep_only:
      - google
      - duckduckgo

general:
  instance_name: "LitMate búsqueda local"

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 1
  formats:
    - html
    - json

engines:
  - name: google
    disabled: false
  - name: duckduckgo
    disabled: false

outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
