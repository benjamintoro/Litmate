use_default_settings:
  engines:
    keep_only:
      - wikipedia
      - openlibrary
      - mwmbl

general:
  instance_name: "LitMate búsqueda local"

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 1
  formats:
    - html
    - json

engines:
  # Sólo motores sin claves ni facturación, con interfaces públicas de consulta.
  # No añadir Google/HTML ni proveedores comerciales para resolver bloqueos.
  - name: wikipedia
    disabled: false
    # Django consume la lista JSON ``results``; una infobox sola se pierde.
    display_type: [list, infobox]
  - name: openlibrary
    engine: openlibrary
    categories: [general, books]
    disabled: false
  - name: mwmbl
    disabled: false

outgoing:
  request_timeout: 4.0
  max_request_timeout: 6.0
  retries: 0
